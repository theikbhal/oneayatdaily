<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towheed's Daily Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 2rem;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            border-radius: 15px 15px 0 0;
        }
        .namaz-checkbox {
            margin: 0.5rem 0;
        }
        .task-section {
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h2 class="text-center mb-0">Towheed's Daily Tasks</h2>
            </div>
            <div class="card-body">
                <!-- Daily Islamic Tasks -->
                <div class="task-section">
                    <h3>Daily Islamic Tasks</h3>
                    <form id="islamicTasksForm">
                        <div class="mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Task Type</label>
                            <select class="form-select" id="taskType" required>
                                <option value="quran">Quran</option>
                                <option value="duwa">Duwa</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="taskNotes" class="form-label">What was learned/practiced?</label>
                            <textarea class="form-control" id="taskNotes" rows="2" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Islamic Task</button>
                    </form>
                </div>

                <!-- Namaz Tracker -->
                <div class="task-section">
                    <h3>Namaz Tracker</h3>
                    <form id="namazForm">
                        <div class="mb-3">
                            <label for="namazDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="namazDate" required>
                        </div>
                        <div class="namaz-checkbox">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="fajr">
                                <label class="form-check-label" for="fajr">Fajr</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="dhuhr">
                                <label class="form-check-label" for="dhuhr">Dhuhr</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="asr">
                                <label class="form-check-label" for="asr">Asr</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="maghrib">
                                <label class="form-check-label" for="maghrib">Maghrib</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isha">
                                <label class="form-check-label" for="isha">Isha</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="namazNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="namazNotes" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Namaz Record</button>
                    </form>
                </div>

                <!-- Typing Progress -->
                <div class="task-section">
                    <h3>Typing Progress</h3>
                    <form id="typingForm">
                        <div class="mb-3">
                            <label for="typingDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="typingDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="typingSpeed" class="form-label">Typing Speed (WPM)</label>
                            <input type="number" class="form-control" id="typingSpeed" required>
                        </div>
                        <div class="mb-3">
                            <label for="typingNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="typingNotes" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Typing Progress</button>
                    </form>
                </div>

                <!-- DSA Progress -->
                <div class="task-section">
                    <h3>DSA Progress</h3>
                    <form id="dsaForm">
                        <div class="mb-3">
                            <label for="dsaDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="dsaDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="problemLink" class="form-label">Problem Link</label>
                            <input type="url" class="form-control" id="problemLink" required>
                        </div>
                        <div class="mb-3">
                            <label for="dsaNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="dsaNotes" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save DSA Progress</button>
                    </form>
                </div>

                <!-- YouTube Videos -->
                <div class="task-section">
                    <h3>YouTube Videos</h3>
                    <form id="youtubeForm">
                        <div class="mb-3">
                            <label for="videoDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="videoDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="videoTitle" class="form-label">Video Title</label>
                            <input type="text" class="form-control" id="videoTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="videoLink" class="form-label">Video Link</label>
                            <input type="url" class="form-control" id="videoLink" required>
                        </div>
                        <div class="mb-3">
                            <label for="videoNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="videoNotes" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Video Record</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Progress Display -->
        <div class="card">
            <div class="header">
                <h3 class="text-center mb-0">Progress History</h3>
            </div>
            <div class="card-body">
                <div id="progressHistory">
                    <!-- Progress will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set default date to today for all date inputs
        document.querySelectorAll('input[type="date"]').forEach(input => {
            input.valueAsDate = new Date();
        });

        // Handle Islamic Tasks Form
        document.getElementById('islamicTasksForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const task = {
                date: document.getElementById('date').value,
                type: document.getElementById('taskType').value,
                notes: document.getElementById('taskNotes').value
            };
            await saveTask('dailyTasks', task);
            e.target.reset();
            document.getElementById('date').valueAsDate = new Date();
        });

        // Handle Namaz Form
        document.getElementById('namazForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const namaz = {
                date: document.getElementById('namazDate').value,
                fajr: document.getElementById('fajr').checked,
                dhuhr: document.getElementById('dhuhr').checked,
                asr: document.getElementById('asr').checked,
                maghrib: document.getElementById('maghrib').checked,
                isha: document.getElementById('isha').checked,
                notes: document.getElementById('namazNotes').value
            };
            await saveTask('namazTracker', namaz);
            e.target.reset();
            document.getElementById('namazDate').valueAsDate = new Date();
        });

        // Handle Typing Form
        document.getElementById('typingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const typing = {
                date: document.getElementById('typingDate').value,
                speed: document.getElementById('typingSpeed').value,
                notes: document.getElementById('typingNotes').value
            };
            await saveTask('typingProgress', typing);
            e.target.reset();
            document.getElementById('typingDate').valueAsDate = new Date();
        });

        // Handle DSA Form
        document.getElementById('dsaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dsa = {
                date: document.getElementById('dsaDate').value,
                problemLink: document.getElementById('problemLink').value,
                notes: document.getElementById('dsaNotes').value
            };
            await saveTask('dsaProgress', dsa);
            e.target.reset();
            document.getElementById('dsaDate').valueAsDate = new Date();
        });

        // Handle YouTube Form
        document.getElementById('youtubeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const video = {
                date: document.getElementById('videoDate').value,
                title: document.getElementById('videoTitle').value,
                link: document.getElementById('videoLink').value,
                notes: document.getElementById('videoNotes').value
            };
            await saveTask('youtubeVideos', video);
            e.target.reset();
            document.getElementById('videoDate').valueAsDate = new Date();
        });

        // Save task to server
        async function saveTask(category, data) {
            try {
                const response = await fetch('/api/towheed/' + category, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    loadProgress();
                }
            } catch (error) {
                console.error('Error saving task:', error);
            }
        }

        // Load progress history
        async function loadProgress() {
            try {
                const response = await fetch('/api/towheed/progress');
                const data = await response.json();
                displayProgress(data);
            } catch (error) {
                console.error('Error loading progress:', error);
            }
        }

        // Display progress history
        function displayProgress(data) {
            const historyDiv = document.getElementById('progressHistory');
            historyDiv.innerHTML = '';

            // Display each category's progress
            Object.entries(data).forEach(([category, items]) => {
                if (items.length > 0) {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'mb-4';
                    categoryDiv.innerHTML = `
                        <h4>${category.replace(/([A-Z])/g, ' $1').trim()}</h4>
                        ${items.map(item => `
                            <div class="card mb-2">
                                <div class="card-body">
                                    <h5 class="card-title">${new Date(item.date).toLocaleDateString()}</h5>
                                    ${Object.entries(item)
                                        .filter(([key]) => key !== 'date')
                                        .map(([key, value]) => `
                                            <p class="card-text">
                                                <strong>${key}:</strong> 
                                                ${typeof value === 'boolean' ? (value ? '✅' : '❌') : value}
                                            </p>
                                        `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    `;
                    historyDiv.appendChild(categoryDiv);
                }
            });
        }

        // Initial load
        loadProgress();
    </script>
</body>
</html>
